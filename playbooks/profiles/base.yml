---
- name: "Base profile: podman1 baseline dev environment"
  hosts: podman1
  strategy: free
  gather_facts: false
  tasks:
  - name: Configuring network
    ansible.builtin.shell: >
      nmcli con mod "System eth1"
      ipv4.addresses "192.168.88.4/24"
      ipv4.gateway " 192.168.88.1"
      ipv4.dns "8.8.8.8"
      ipv4.dns-search lab
      ipv4.method manual

  - name: Reloading Network
    service:
      name: NetworkManager
      state: restarted

  - name: Building Host File
    copy:
      dest: /etc/hosts
      content: |
        127.0.0.1   localhost localhost.localdomain localhost4 localhost4.localdomain4
        :1         localhost localhost.localdomain localhost6 localhost6.localdomain6
        192.168.88.4 podman1.lab workstation
      force: true

  - name: Disable VMware Tools guest time sync (chrony is the sole time authority)
    ansible.builtin.copy:
      dest: /etc/vmware-tools/tools.conf
      content: |
        [timetracker]
        disable = TRUE
      owner: root
      group: root
      mode: "0644"
    notify: Restart vmtoolsd

  - name: Always step the clock on large offsets, not just the first 3 updates
    ansible.builtin.lineinfile:
      path: /etc/chrony.conf
      regexp: '^makestep '
      line: 'makestep 1.0 -1'
    notify: Restart chronyd

  - name: Install base packages
    ansible.builtin.dnf:
      name: [ 'bash-completion', 'make', 'vim', 'skopeo', 'podman', 'podman-plugins', 'systemd-container', 'nmap-ncat', 'python3-pip']
      state: latest

  - name: Creating Welcome Message
    file:
      path: /etc/profile.d/welcome.sh
      state: touch
      mode: 0755

  - name: Building Welcome Message
    blockinfile:
      dest: /etc/profile.d/welcome.sh
      block: |
         #!/bin/bash
         #
         echo -e '
                   +----------------------------------+
                   |    Welcome to vagrant dev VM     |
                   |        Happy Development!        |
                   +----------------------------------+
         '"
          You are logged into \"`hostname`\" as the \"`whoami`\" account.
          This system is running `cat /etc/redhat-release`

          For root - use \`sudo\` or \`sudo su -\`

         "

  # VS Code Remote-SSH creates a new forwarded-agent socket on every
  # reconnect, but shells opened before the reconnect keep the old path, so
  # git over SSH fails with "Permission denied (publickey)". This checks
  # before each prompt and re-points a dead SSH_AUTH_SOCK at a live one.
  - name: Repair a stale SSH agent socket in already-open shells
    ansible.builtin.copy:
      dest: /etc/profile.d/ssh-agent-refresh.sh
      owner: root
      group: root
      mode: "0644"
      content: |
        # Managed by dev_lab (playbooks/profiles/base.yml).
        # VS Code Remote-SSH makes a new agent socket on every reconnect; shells
        # opened earlier keep the old, dead path. Re-point them at a live one.
        [[ $- == *i* ]] || return 0
        _refresh_ssh_auth_sock() {
          [ -S "$SSH_AUTH_SOCK" ] && return
          local s
          for s in $(ls -t /run/user/"$(id -u)"/vscode-ssh-auth-sock-* 2>/dev/null); do
            [ -S "$s" ] && { export SSH_AUTH_SOCK="$s"; return; }
          done
        }
        PROMPT_COMMAND="_refresh_ssh_auth_sock${PROMPT_COMMAND:+;$PROMPT_COMMAND}"

  # Claude Code keeps session transcripts (what /resume and the VS Code
  # extension's history list read) and per-project memory under
  # ~/.claude/projects, which lives on the VM disk and is lost on rebuild.
  # Symlink those dirs into the host-backed /data mount instead. Credentials
  # and the rest of ~/.claude stay local to the VM on purpose. Works for both
  # the CLI and the VS Code extension (its bundled binary reads ~/.claude).
  - name: Check whether the host /data folder is mounted
    ansible.builtin.command: mountpoint -q /data
    register: data_mount
    changed_when: false
    failed_when: false

  - name: Persist Claude Code history on the host /data mount
    when: data_mount.rc == 0
    become: true
    become_user: vagrant
    ansible.builtin.shell: |
      set -eu
      persist=/data/claude
      changed=0
      mkdir -p "$HOME/.claude" && chmod 700 "$HOME/.claude"
      for d in {{ claude_persist_dirs | join(' ') }}; do
        src="$HOME/.claude/$d"
        mkdir -p "$persist/$d"
        [ "$(readlink "$src" 2>/dev/null)" = "$persist/$d" ] && continue
        if [ -d "$src" ] && [ ! -L "$src" ]; then
          # Existing VM: merge local history into the share (never overwrite).
          cp -an "$src/." "$persist/$d/" && rm -rf "$src"
        fi
        rm -f "$src"
        ln -s "$persist/$d" "$src"
        changed=1
      done
      echo "changed=$changed"
    args:
      executable: /bin/bash
    vars:
      claude_persist_dirs: [ 'projects', 'plans', 'file-history' ]
    register: claude_persist
    changed_when: "'changed=1' in claude_persist.stdout"

  # Claude Code deletes transcripts older than 30 days by default, which would
  # defeat the point. Set via managed settings so ~/.claude/settings.json is
  # left alone for the user.
  - name: Create the Claude Code managed settings directory
    ansible.builtin.file:
      path: /etc/claude-code
      state: directory
      owner: root
      group: root
      mode: "0755"

  - name: Keep Claude Code transcripts for 10 years instead of 30 days
    ansible.builtin.copy:
      dest: /etc/claude-code/managed-settings.json
      owner: root
      group: root
      mode: "0644"
      content: |
        {
          "cleanupPeriodDays": 3650
        }

  handlers:
  - name: Restart vmtoolsd
    ansible.builtin.service:
      name: vmtoolsd
      state: restarted

  - name: Restart chronyd
    ansible.builtin.service:
      name: chronyd
      state: restarted
